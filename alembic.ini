# Alembic configuration for Trade Fix Radio.
#
# The database URL is NOT set here. It is resolved at runtime by
# tradefix_radio/persistence/migrations/env.py from the validated AppSettings,
# so migrations always target the same database the station uses, and so a
# PostgreSQL password never has to be written into a tracked file (§68).

[alembic]
script_location = tradefix_radio/persistence/migrations
prepend_sys_path = .
# Required by Alembic 1.20+. Without it, prepend_sys_path is split on spaces,
# commas AND colons — which mangles Windows paths like `D:\.Music` and emits a
# DeprecationWarning on every invocation.
path_separator = os
# UTC, sortable, and readable in a directory listing.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s
timezone = UTC
# Longer than the default so autogenerated filenames stay descriptive.
truncate_slug_length = 48

[post_write_hooks]
# `exec` rather than `console_scripts`: the console_scripts loader resolves
# entrypoints from Alembic's own distribution metadata and cannot see ruff.
hooks = ruff_format, ruff_fix
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
ruff_fix.type = exec
ruff_fix.executable = ruff
ruff_fix.options = check --fix --exit-zero REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
