    label: UK Trap
    bpm: {min: 136, max: 156}
    # Top of the band reaches the ceiling so that extreme-volatility programming has
    # real choice. With only dnb and cinematic at the top the station would alternate
    # between two genres through a long violent session, which §11 exists to prevent.
    # Stopping at 98 left exactly that problem in the last two points of the range.
    energy: {min: 58, max: 100}
    vocal_affinity: 0.9
    vocal_styles: [rap, ad_lib]
    instrumentation: [sliding 808, sharp hat, detuned bell, reversed pad]
    mood: [driving, cold, confrontational]
    rhythm_density: 0.85
    bass_intensity: 0.9
    drum_intensity: 0.88
