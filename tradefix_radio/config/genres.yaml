# ============================================================================
#  GENRE LIBRARY  (§10)
#
#  §10: "Do not hard-code the application around this exact list. Genres are
#  config-driven." Nothing in the code names a genre. Adding one is an edit here.
#
#  HOW §1's ENERGY MAPPING EMERGES
#  --------------------------------
#  §1 gives example mappings (quiet Asian session -> 75-95 BPM lo-fi; strong
#  breakout -> 125-160 BPM aggressive trap) and then says: "Do NOT hard-code these
#  exact mappings as simplistic if/else rules. Build a weighted, configurable
#  music-director system."
#
#  So there is no if/else chain anywhere. Each genre declares the ENERGY BAND it
#  belongs in, and the director scores every genre by how well its band fits the
#  current market energy. Lo-fi tops the list in a dead market because its band is
#  0-38, not because a rule says "if quiet then lofi". Change a band here and the
#  programming changes, with no code edit.
#
#  FIELDS
#  ------
#  label             display name
#  bpm               the genre's own tempo range; intersected with the energy
#                    band's range at selection time
#  energy            market-energy band where this genre belongs (0-100). The
#                    PRIMARY selection driver.
#  vocal_affinity    0-1, how naturally the genre carries vocals. Feeds the §8
#                    vocal decision together with the §1 energy probability.
#  vocal_styles      which §8 vocal styles suit it
#  instrumentation   prompt hints fed to the generator
#  mood              emotional tone words (§1 "emotional tone")
#  rhythm/bass/drum/melodic
#                    0-1 intensity defaults; the director modulates them by energy
#  regime_affinity   SECONDARY nudge, per §5 regime. 1.0 is neutral and is the
#                    default for anything unlisted. Used only where a genre is
#                    genuinely regime-specific — drill in a bearish break, cinematic
#                    in extreme volatility. Deliberately sparse: a hand-tuned 14x28
#                    matrix would be unmaintainable and would duplicate what the
#                    energy band already expresses.
#  session_affinity  §97 session personality. Weighted below regime/energy by
#                    music.session_bias_strength, because §97 says market energy has
#                    higher priority.
#  experimental      true = only admitted when the queue buffer is healthy (§94/§95)
#  pairs_with        plausible secondary genres (§8 secondary_genre)
#  structures        candidate section sequences
# ============================================================================

version: 1

defaults:
  vocal_affinity: 0.5
  vocal_styles: [rap, melodic_rap, sung]
  rhythm_density: 0.55
  bass_intensity: 0.55
  drum_intensity: 0.55
  melodic_complexity: 0.5
  experimental: false
  regime_affinity: {}
  session_affinity: {}
  structures:
    - [intro, verse, hook, verse, hook, outro]

