      - "Macro relationships are context, not signals."
    phrases:
      - "real yields lean on it, some seasons"
      - "macro is context, not a trigger"
    # Specific phrases, never bare words. A standalone "always" here rejected the
    # *correct* hedge "not always, but often", which is exactly the phrasing §14 wants.
    # The library validator now refuses single-word entries for this reason.
    forbidden:
