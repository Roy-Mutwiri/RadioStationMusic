  asian_session:
    category: gold
    markets: [XAUUSD]
    label: Asian Session
    certainty: contextual
    weight: 1.0
    session_affinity: {asian: 2.0, sydney: 1.6}
    teaching_points:
      - "Asian hours are often quieter for gold, with narrower ranges."
      - "A quiet session is a reason to size differently, not a reason to force a trade."
    phrases:
