  dxy_relationship:
    category: gold
    markets: [XAUUSD]
    label: Dollar Relationship
    certainty: speculative
    weight: 0.7
    teaching_points:
      - "Gold and the dollar have often moved inversely, but the relationship weakens and sometimes inverts."
      - "Treating a historical correlation as a rule is how a hedge becomes a second position in the same direction."
    phrases:
      - "dollar up, gold down, usually, not always"
      - "the correlation shows up when it feels like it"
    forbidden:
      - "always inverse"
      - "guaranteed inverse"
      - "dollar up means gold down"
      - "perfect hedge"
    pairs_with: [correlation, risk_sentiment, treasury_yields]

  treasury_yields:
    category: gold
    markets: [XAUUSD]
    label: Treasury Yields
    certainty: speculative
    weight: 0.6
    teaching_points:
