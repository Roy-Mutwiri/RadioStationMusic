    session_affinity: {london_new_york_overlap: 2.0, asian_london_overlap: 1.5}
    teaching_points:
      - "The London/New York overlap is usually the deepest part of the gold day."
      - "Deeper liquidity absorbs size better; it does not make direction clearer."
