# ============================================================================
#  Mode overlay: PRODUCTION  (§72)
#
#  Real market feed + real music model + OBS.
#
#  This overlay sets only what production *requires*. It deliberately does NOT
#  set secrets: api.control_token, obs.password and market.rest_api_key must come
#  from .env or the environment (§68). AppSettings refuses to start in production
#  without a control token, and without a real feed and provider — so a
#  misconfigured production launch fails at startup, not on air.
# ============================================================================

market:
  # MetaTrader 5 attaches to a locally running, logged-in terminal — no API key
  # (ADR-03). Change to `rest` and set market.rest_base_url / rest_api_key to use
  # an HTTP data provider instead.
  feed: metatrader5
  poll_interval_seconds: 1.0

# Which market the station programmes against, and when it may change.
#
# XAUUSD is the station's subject. It is also shut for roughly 49 hours a week, and a radio
# station cannot take the weekend off, so BTCUSD — which never closes — carries those hours.
markets:
  primary: XAUUSD
  fallback: [BTCUSD]

  # Hysteresis. These are the numbers that decide whether a session boundary sounds like a
  # deliberate change of programming or like the station panicking.
  #
  # Reopening is held five times longer than closing, deliberately. Leaving a closed market
  # two minutes late costs nothing — the data has genuinely stopped. Returning two minutes
  # early, on a straggling pre-open tick, means crossing back and forth over the boundary,
  # which a listener hears as the station changing its mind.
  switch_confirmation_seconds: 120
  reopen_confirmation_seconds: 300
  minimum_active_market_seconds: 180

  symbols:
    XAUUSD:
      # Gold ticks continuously while it trades, so 90 seconds of silence is already
      # abnormal. Note what STALE does *not* do: it never authorises the move to Bitcoin.
      # Only a confirmed closure does that — a silent feed on a trading day is a fault to
      # be fixed, not a market that has shut.
      stale_after_seconds: 90
      unavailable_after_seconds: 300
    BTCUSD:
      # Crypto venues are noisier than a broker feed and a thin minute is ordinary rather
      # than alarming, so the thresholds are looser. They are also less consequential:
      # BTCUSD is only ever on air because gold is already shut.
      stale_after_seconds: 180
      unavailable_after_seconds: 600
      # Broker spellings, in the order discovery should try them. Required for any routed
      # symbol on a real feed: without it the station asks for "BTCUSD" and nothing else,
      # and most MT5 brokers do not call it that.
      aliases: [BTCUSD, BTCUSD.m, BTCUSDm, BTCUSD_, BITCOIN]

generation:
  provider: ace_step

  # One job at a time. §7.22 measured the alternative and the schema refuses
  # max_concurrent_jobs > 1 for this provider: two generations on one card is how
  # an OOM is manufactured, not how throughput is gained.
  max_concurrent_jobs: 1

  ace_step:
    # ACE-Step runs as a separate OS process under its own Python 3.12. That is
    # forced rather than chosen — ACE-Step declares requires-python >=3.11,<3.13
    # and ADR-01 pins this project to 3.10 for librosa's numba wheels — and it is
    # also what §7.5 wants, so a model crash cannot reach the playout engine.
    # See docs/status/PHASE_7_ENVIRONMENT.md.
    base_url: http://127.0.0.1:8001

    # The 8-16 GB tier from ACE-Step's own hardware table. XL (4B) needs ~9 GB
    # bf16 and does not fit alongside a desktop on a 12 GB card.
    dit_model: acestep-v15-turbo
    lm_model: acestep-5Hz-lm-0.6B

    profile: balanced

    # Measured on an RTX 3060 (12 GB): generation adds 1077-1170 MB on top of the
    # resident model, and the card has ~2.3-2.6 GB free with a desktop running.
    # The original 5200 placeholder would have refused every job.
    min_free_vram_mb: 1800

    # A 60-second track takes 42-55 s to generate on this hardware. 300 s leaves
    # room for a long track at the quality profile without masking a hang.
    timeout_seconds: 300.0

    # Cold start loads ~6 GB of checkpoint and may download it on first run.
    load_timeout_seconds: 1800.0

    # Off: the station composed a deliberate caption and Phase 3 validated the
    # lyrics against §14 and §17. Letting the model rewrite them would put
    # unvalidated words about trading on air.
    thinking: false

audio:
  # VB-Audio Virtual Cable keeps station output off the operator's desktop mixer
  # and gives OBS a clean, level-stable capture source.
  sink: sounddevice
  device_name: CABLE Input

logging:
  level: INFO
  # Structured JSON so a week of unattended logs is machine-queryable (§55).
  console_format: json

obs:
  enabled: true

retention:
  enabled: true
